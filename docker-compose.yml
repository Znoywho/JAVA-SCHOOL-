# version: '3.8'

services:
  frontend:
    build: 
      context: ./FE/my-app
      dockerfile: ../Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./BE        # tên thư mục Spring Boot của bạn
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/rebikedatabase
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=Rebike123!
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Rebike123!
      POSTGRES_DB: rebikedatabase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
